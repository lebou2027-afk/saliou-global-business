<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALIOU GLOBAL BUSINESS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:12px;margin:0}
.card{background:#1e293b;padding:14px;border-radius:12px;margin:10px 0}
input,button{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:none;box-sizing:border-box}
input{background:#334155;color:#fff;font-size:16px}
button{background:#22c55e;color:#000;font-weight:bold;font-size:16px}
.prod{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #334155}
h2{text-align:center;color:#22c55e}
#status{text-align:center;font-size:13px;margin:10px}
</style>
</head>
<body>
<h2>SALIOU GLOBAL BUSINESS<br><small style="color:#94a3b8;font-size:12px">✅ Version Synchronisée Cloud</small></h2>
<div id="status">🔄 Connexion à Supabase...</div>

<div class="card">
<input id="pname" placeholder="Nom du produit (ex: Riz)">
<input id="pprice" type="number" placeholder="Prix FCFA">
<input id="pstock" type="number" placeholder="Stock">
<button onclick="addProduct()">➕ AJOUTER ET SYNCHRONISER</button>
</div>

<div class="card">
<h3>📦 Mes Produits (<span id="count">0</span>)</h3>
<div id="plist">Chargement...</div>
</div>

<script>
const supa = supabase.createClient(
"https://kekwwotivczmthgrfwbx.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtla3d3b3RpdmN6bXRoZ3Jmd2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4ODQ2MTAsImV4cCI6MjA4MTQ2MDYxMH0.4u0a3YIovEFxJ2bac5hn7-XzG-CUCBoULXODMr3Ib7Q"
);

async function addProduct(){
let n=document.getElementById('pname').value.trim();
let p=document.getElementById('pprice').value;
let s=document.getElementById('pstock').value||0;
if(!n||!p)return alert('Mets nom et prix');
document.getElementById('status').innerText='⏳ Synchronisation...';
let {error}=await supa.from('products').insert([{name:n,price:Number(p),stock:Number(s)}]);
if(error){alert(error.message);document.getElementById('status').innerText=error.message;}
else{document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pstock').value='';loadProducts();}
}

async function loadProducts(){
let {data,error}=await supa.from('products').select('*').order('created_at',{ascending:false});
if(error){document.getElementById('status').innerText=error.message;return}
document.getElementById('count').innerText=data.length;
document.getElementById('plist').innerHTML=data.map(x=>`<div class=prod><div><b>${x.name}</b><br><small>${x.price} FCFA</small></div><div>Stock ${x.stock} <button onclick="delP('${x.id}')" style="width:auto;background:#ef4444;color:#fff;padding:6px 10px;margin-left:8px">X</button></div></div>`).join('')||'Aucun produit - Ajoutes-en un !';
document.getElementById('status').innerText='✅ '+data.length+' produits synchronisés - Visible sur tous les appareils';
}

async function delP(id){if(confirm('Supprimer ce produit ?')){await supa.from('products').delete().eq('id',id);loadProducts();}}
loadProducts();
setInterval(loadProducts,7000);
</script>
</body>
</html>
