* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg, #0d1b2a, #1b263b);
  color: #e5e7eb;
}

button,
input {
  font: inherit;
}

.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}

.auth-card {
  max-width: 440px;
  width: 100%;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.45);
}

.brand-block {
  margin-bottom: 24px;
  text-align: center;
}

.brand-badge {
  display: inline-block;
  background: #fbbf24;
  color: #111827;
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 700;
  margin-bottom: 12px;
}

.brand-block h1 {
  margin: 0;
  font-size: 2rem;
}

.brand-block p {
  color: #cbd5e1;
}

.auth-form {
  display: grid;
  gap: 18px;
}

.auth-form label {
  display: grid;
  gap: 8px;
  color: #dbeafe;
  font-weight: 600;
}

.auth-form input {
  width: 100%;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #0f172a;
  color: #f8fafc;
  padding: 12px 14px;
}

.auth-form button,
.logout-button,
.assistant-form-row button {
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #22c55e, #14b8a6);
  color: #052e16;
  font-weight: 700;
  padding: 12px 18px;
  cursor: pointer;
}

.demo-credentials {
  margin-top: 20px;
  display: grid;
  gap: 6px;
  color: #cbd5e1;
  font-size: 0.95rem;
}

.dashboard-shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 22px 48px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.brand-mini {
  font-size: 0.8rem;
  font-weight: 700;
  color: #fbbf24;
}

.topbar h2 {
  margin: 4px 0 0;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}

.kpi-card {
  background: rgba(15, 23, 42, 0.82);
  padding: 18px;
  border-radius: 14px;
  border: 1px solid rgba(148, 163, 184, 0.22);
}

.kpi-card span {
  display: block;
  color: #b7c2d6;
  margin-bottom: 10px;
}

.kpi-card strong {
  font-size: 1.7rem;
}

.kpi-card.accent {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(45, 212, 191, 0.12));
}

.grid-two,
.grid-three {
  display: grid;
  gap: 18px;
  margin-bottom: 22px;
}

.grid-two {
  grid-template-columns: 2fr 1fr;
}

.grid-three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.panel {
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 14px;
  padding: 18px;
}

.panel h3 {
  margin-top: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  padding: 10px 8px;
  text-align: left;
}

.big-number {
  font-size: 2.3rem;
  margin: 10px 0;
  color: #fbbf24;
  font-weight: 700;
}

.warning-box {
  margin-top: 18px;
  background: rgba(251, 191, 36, 0.12);
  border: 1px solid rgba(251, 191, 36, 0.3);
  border-radius: 10px;
  padding: 14px;
  display: grid;
  gap: 8px;
}

.list-compact {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 12px;
}

.list-compact li {
  padding: 10px 0;
  border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.list-compact small {
  color: #94a3b8;
}

.assistant-panel {
  margin-top: 16px;
}

.assistant-form-row {
  display: flex;
  gap: 12px;
  margin-top: 14px;
}

.assistant-form-row input {
  flex: 1;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #0f172a;
  color: #f8fafc;
  padding: 12px 14px;
}

.assistant-result {
  margin-top: 18px;
  background: rgba(15, 118, 110, 0.12);
  border: 1px solid rgba(45, 212, 191, 0.25);
  border-radius: 12px;
  padding: 16px;
}

.assistant-result ul {
  margin-top: 12px;
  padding-left: 20px;
}

@media (max-width: 900px) {
  .grid-two,
  .grid-three {
    grid-template-columns: 1fr;
  }

  .assistant-form-row {
    flex-direction: column;
  }
}
